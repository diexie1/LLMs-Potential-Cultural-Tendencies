name: Check Windows platform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install verified dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Offline Python checks
        run: python -m unittest discover -s tests -v
      - name: Console checks
        run: |
          node --check app/static/js/console.js
          node tests/test_console_behavior.cjs
          node tests/test_console_render.cjs
