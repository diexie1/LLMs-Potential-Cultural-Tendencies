<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_name }} · 模型对话测试</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css?v=5" />
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="bg-veil" aria-hidden="true"></div>

  <div class="app-shell">
    <div class="page chat-page">
      <header class="topbar">
        <div class="brand">
          <strong>{{ app_name }}</strong>
          <span>模型对话测试 · STREAMING</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <a class="btn btn-ghost btn-sm" href="/">欢迎页</a>
          <a class="btn btn-ghost btn-sm" href="/console">实验工作台</a>
        </div>
      </header>

      <section class="card chat-toolbar-card">
        <h3>API / 模型</h3>
        <div class="form-inline">
          <div class="group">
            <label class="field-label">提供方</label>
            <select id="provider">
              <option value="deepseek">deepseek</option>
              <option value="openai">openai</option>
              <option value="qwen">qwen</option>
              <option value="gemini">gemini</option>
            </select>
          </div>
          <div class="group grow">
            <label class="field-label">模型</label>
            <select id="model"></select>
          </div>
          <div class="group">
            <label class="field-label">温度</label>
            <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7" />
          </div>
          <button class="btn btn-ghost btn-sm" id="btn-refresh-models" type="button">刷新模型</button>
          <button class="btn btn-ghost btn-sm" id="btn-clear" type="button">清空对话</button>
        </div>
        <p class="chat-hint">使用当前配置的 API 密钥进行流式对话；可随时切换提供方与模型。</p>
      </section>

      <section class="card chat-main-card">
        <div class="chat-messages" id="messages" aria-live="polite"></div>
        <div class="chat-composer">
          <textarea id="input" rows="3" placeholder="输入消息，Enter 发送，Shift+Enter 换行…"></textarea>
          <div class="chat-composer-actions">
            <button class="btn btn-danger btn-sm" id="btn-stop" type="button" disabled>停止</button>
            <button class="btn btn-primary" id="btn-send" type="button">发送</button>
          </div>
        </div>
      </section>
    </div>

    <footer class="site-footer">
      <p class="credit-line">
        <span class="credit-label">项目负责人</span>
        南京师范大学 心理学院 谢恩慧
      </p>
      <p class="credit-line">
        <span class="credit-label">平台制作人</span>
        南京师范大学 心理学院 李佳斌
      </p>
    </footer>
  </div>

  <script src="/static/js/chat.js?v=2"></script>
</body>
</html>
